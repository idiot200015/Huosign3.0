<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>火象社区 - 首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ====== 设计令牌 ====== */
    :root {
      --brand:        #E72737;
      --brand-deep:   #C51826;
      --brand-soft-1: #FFE2E4;
      --brand-soft-2: #FFE9EC;
      --warn:         #FF9F1C;
      --info:         #3A86FF;
      --success:      #2DC771;
      --error:        #F44336;
      --text-1: #333333;
      --text-2: #666666;
      --text-3: #999999;
      --disabled: #D1D1D1;
      --line: #E9EDF4;
      --card-bg: #F0F2F8;
      --bg-page: #F8F9FC;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-1);
      font-size: 14px;
      line-height: 1.5;
    }
    body { background: #cccccc; }
    .num-font { font-family: "DIN Pro", "DINPro", "DIN Alternate", -apple-system, sans-serif; font-feature-settings: "tnum"; }

    /* ====== 手机外壳 ====== */
    .phone {
      max-width: 375px;
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg-page);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.08);
    }
    .scroll-area {
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      scroll-behavior: smooth;
    }
    .scroll-area::-webkit-scrollbar { width: 0; }

    /* ====== 顶部导航栏（固定）====== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: saturate(160%) blur(12px);
      -webkit-backdrop-filter: saturate(160%) blur(12px);
      border-bottom: 1px solid rgba(233,237,244,0.8);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FF4757 0%, #E72737 50%, #C51826 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(231,39,55,0.32);
    }
    .logo svg { display: block; }
    .brand-title { font-size: 18px; font-weight: 600; color: var(--text-1); letter-spacing: 0.5px; }
    .msg-btn {
      position: relative;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border: 0; background: transparent; cursor: pointer;
      transition: transform 0.15s ease;
    }
    .msg-btn:active { transform: scale(0.92); }
    .badge {
      position: absolute;
      top: 4px; right: 4px;
      min-width: 16px; height: 16px;
      padding: 0 4px;
      background: var(--brand);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 2px #fff;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 2px #fff, 0 0 0 0 rgba(231,39,55,0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 0 2px #fff, 0 0 0 6px rgba(231,39,55,0); }
    }

    /* ====== 滚动主区域 ====== */
    .scroll-content { padding-bottom: 96px; }

    /* ====== Banner ====== */
    .banner-wrap {
      padding: 12px 16px 0;
    }
    .banner-viewport {
      position: relative;
      width: 100%;
      height: 132px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(231,39,55,0.12);
    }
    .banner-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }
    .banner-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      position: relative;
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .banner-1 { background: linear-gradient(120deg, #FF4757 0%, #E72737 50%, #8E0E1A 100%); }
    .banner-2 { background: linear-gradient(120deg, #FFB347 0%, #FF9F1C 55%, #D17800 100%); }
    .banner-3 { background: linear-gradient(120deg, #C51826 0%, #8E0E1A 60%, #4A0810 100%); }
    .banner-tag {
      align-self: flex-start;
      padding: 3px 8px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .banner-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 26px;
      max-width: 80%;
      text-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }
    .banner-sub {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .banner-deco {
      position: absolute;
      right: -20px;
      top: -20px;
      width: 160px;
      height: 160px;
      opacity: 0.18;
      pointer-events: none;
    }
    .banner-dots {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 8px;
      display: flex;
      gap: 4px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.5);
      transition: width 0.3s ease, background 0.3s ease;
    }
    .dot.active {
      width: 16px;
      background: #fff;
    }

    /* ====== 简卡通用 ====== */
    .card-section { padding: 12px 16px 0; }
    .row-2 { display: flex; gap: 12px; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .card:active {
      transform: scale(0.985);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
    }

    /* 等级卡 */
    .level-card {
      flex: 0 0 60%;
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F6 100%);
      border: 1px solid #FFE2E4;
      position: relative;
      overflow: hidden;
    }
    .level-card::before {
      content: "";
      position: absolute;
      right: -30px; top: -30px;
      width: 90px; height: 90px;
      background: radial-gradient(circle, #FFE9EC 0%, transparent 70%);
      border-radius: 50%;
    }
    .lv-row {
      display: flex; align-items: center; justify-content: space-between;
      position: relative; z-index: 1;
    }
    .lv-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px;
      background: linear-gradient(135deg, #E72737 0%, #C51826 100%);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(231,39,55,0.32);
    }
    .lv-arrow { color: var(--text-3); }
    .progress-bar {
      margin-top: 12px;
      height: 6px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #FF6B7C 0%, #E72737 100%);
      border-radius: 999px;
      box-shadow: 0 0 6px rgba(231,39,55,0.4);
      width: 0;
      transition: width 0.8s ease;
    }
    .lv-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-3);
    }
    .lv-xp { color: var(--text-1); font-weight: 600; }

    /* 评分卡 */
    .score-card {
      flex: 1 1 40%;
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF8E8 100%);
      border: 1px solid #FFEAC2;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .score-card::before {
      content: "";
      position: absolute;
      right: -20px; bottom: -20px;
      width: 70px; height: 70px;
      background: radial-gradient(circle, #FFE9C2 0%, transparent 70%);
      border-radius: 50%;
    }
    .score-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--text-3);
      position: relative; z-index: 1;
    }
    .score-num-wrap {
      display: flex; align-items: baseline; gap: 4px;
      position: relative; z-index: 1;
      margin-top: 4px;
    }
    .score-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-1);
      line-height: 1;
    }
    .score-unit { font-size: 12px; color: var(--text-3); }
    .score-grade {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--warn);
      font-weight: 500;
      position: relative; z-index: 1;
    }
    .grade-letter {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px;
      background: var(--warn);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
    }

    /* 实训账户 */
    .practice-card {
      background: linear-gradient(135deg, #1A1F36 0%, #2C2F4A 60%, #4A1820 100%);
      color: #fff;
      padding: 16px;
      border-radius: 12px;
      margin-top: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.18);
      transition: transform 0.12s ease;
    }
    .practice-card:active { transform: scale(0.99); }
    .practice-card::after {
      content: "";
      position: absolute;
      right: -40px; top: -40px;
      width: 160px; height: 160px;
      background: radial-gradient(circle, rgba(231,39,55,0.35) 0%, transparent 70%);
      border-radius: 50%;
    }
    .practice-head {
      display: flex; align-items: center; justify-content: space-between;
      position: relative; z-index: 1;
    }
    .practice-title {
      font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 6px;
    }
    .practice-status {
      padding: 2px 8px;
      background: rgba(45, 199, 113, 0.18);
      color: #5BE19E;
      font-size: 10px;
      border-radius: 4px;
      font-weight: 500;
    }
    .practice-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      position: relative; z-index: 1;
    }
    .practice-item .label {
      font-size: 10px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 4px;
    }
    .practice-item .value {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .practice-item .value.up { color: #FF6B7C; }
    .practice-item .value.down { color: #5BE19E; }

    /* 快捷入口 */
    .quick-row {
      margin-top: 12px;
      background: #fff;
      border-radius: 12px;
      padding: 14px 8px;
      display: flex;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .quick-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 4px 0;
      transition: transform 0.12s ease;
      text-decoration: none;
      color: var(--text-1);
    }
    .quick-item:active { transform: scale(0.94); }
    .quick-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    .qi-train { background: linear-gradient(135deg, #FFE2E4 0%, #FFB8BF 100%); }
    .qi-learn { background: linear-gradient(135deg, #DCEAFF 0%, #A6C7FF 100%); }
    .qi-invite { background: linear-gradient(135deg, #FFE9C2 0%, #FFCB6E 100%); }
    .quick-label { font-size: 12px; color: var(--text-1); font-weight: 500; }

    /* 火象专栏标题（吸顶） */
    .column-header {
      position: sticky;
      top: 44px;
      z-index: 20;
      padding: 16px 16px 8px;
      background: var(--bg-page);
      transition: box-shadow 0.2s ease, padding 0.2s ease;
    }
    .column-header.stuck {
      background: rgba(248,249,252,0.96);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 12px rgba(15,23,42,0.04);
      padding: 10px 16px 8px;
    }
    .column-title {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
    }
    .column-title-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-1);
      letter-spacing: 0.5px;
    }
    .column-underline {
      width: 24px;
      height: 3px;
      background: var(--brand);
      border-radius: 999px;
    }

    /* 文章列表 */
    .article-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .article-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      cursor: pointer;
      position: relative;
    }
    .article-card:active {
      transform: scale(0.99);
      box-shadow: 0 1px 4px rgba(15,23,42,0.04);
    }
    .author-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .avatar-wrap {
      position: relative;
      width: 32px; height: 32px;
      flex-shrink: 0;
    }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }
    .av-1 { background: linear-gradient(135deg, #FF4757, #C51826); }
    .av-2 { background: linear-gradient(135deg, #3A86FF, #1E5BC0); }
    .av-3 { background: linear-gradient(135deg, #2DC771, #1A8E4C); }
    .av-4 { background: linear-gradient(135deg, #FF9F1C, #C77800); }
    .v-mark {
      position: absolute;
      right: -2px; bottom: -2px;
      width: 14px; height: 14px;
      background: var(--brand);
      border: 1.5px solid #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .author-meta { flex: 1; min-width: 0; }
    .author-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-1);
      display: flex; align-items: center; gap: 6px;
    }
    .author-time {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 1px;
    }
    .pin-tag {
      flex-shrink: 0;
      padding: 2px 6px;
      background: var(--brand-soft-1);
      color: var(--brand);
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #FFC9CE;
    }
    .article-body {
      display: flex;
      gap: 10px;
    }
    .article-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .article-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 22px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-summary {
      font-size: 12px;
      color: var(--text-2);
      line-height: 18px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-cover {
      flex-shrink: 0;
      width: 96px; height: 72px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .cover-1 { background: linear-gradient(135deg, #FF6B7C 0%, #E72737 60%, #8E0E1A 100%); }
    .cover-2 { background: linear-gradient(135deg, #FFB347 0%, #FF9F1C 60%, #D17800 100%); }
    .cover-3 { background: linear-gradient(135deg, #3A86FF 0%, #1E5BC0 60%, #0F3D8A 100%); }
    .cover-4 { background: linear-gradient(135deg, #2DC771 0%, #1A8E4C 60%, #0E5E32 100%); }
    .cover-deco {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.85);
    }
    .article-actions {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-3);
    }
    .stat-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .stats-left { display: flex; gap: 14px; }
    .actions-right { display: flex; gap: 8px; }
    .action-btn {
      background: transparent;
      border: 0;
      padding: 4px 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-3);
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.12s ease, color 0.12s ease, transform 0.12s ease;
    }
    .action-btn:active { transform: scale(0.92); background: var(--card-bg); }
    .action-btn.liked { color: var(--brand); }
    .action-btn.liked svg path { fill: var(--brand); stroke: var(--brand); }
    .like-pop { animation: likePop 0.36s ease; }
    @keyframes likePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.34); }
      100% { transform: scale(1); }
    }

    /* 底部 Tab 栏（固定） */
    .tabbar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 375px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding-bottom: 34px; /* 底部安全区 */
      z-index: 40;
    }
    .tabbar-inner {
      display: flex;
      height: 56px;
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-3);
      text-decoration: none;
      transition: transform 0.12s ease;
    }
    .tab-item:active { transform: scale(0.92); }
    .tab-item.active { color: var(--brand); }
    .tab-label { font-size: 10px; font-weight: 500; }

    /* 底部分享面板 */
    .sheet-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
      max-width: 375px;
      margin: 0 auto;
    }
    .sheet-mask.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed;
      left: 50%;
      transform: translate(-50%, 100%);
      bottom: 0;
      width: 100%;
      max-width: 375px;
      background: #fff;
      border-radius: 16px 16px 0 0;
      z-index: 51;
      transition: transform 0.28s cubic-bezier(0.22,0.61,0.36,1);
      padding-bottom: 34px;
    }
    .sheet.show { transform: translate(-50%, 0); }
    .sheet-title {
      text-align: center;
      padding: 16px 0 4px;
      font-size: 14px;
      color: var(--text-3);
    }
    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 16px;
    }
    .share-ch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px 0;
      border-radius: 8px;
      transition: background 0.12s ease;
    }
    .share-ch:active { background: var(--card-bg); }
    .share-ic {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .ic-save { background: linear-gradient(135deg, #999, #666); }
    .ic-wechat { background: linear-gradient(135deg, #2DC771, #1A8E4C); }
    .ic-moments { background: linear-gradient(135deg, #FF9F1C, #D17800); }
    .ic-copy { background: linear-gradient(135deg, #3A86FF, #1E5BC0); }
    .ic-system { background: linear-gradient(135deg, #E72737, #C51826); }
    .share-name { font-size: 12px; color: var(--text-2); }
    .sheet-cancel {
      margin: 0 16px 12px;
      height: 44px;
      border: 0;
      border-top: 8px solid var(--bg-page);
      background: #fff;
      font-size: 16px;
      color: var(--text-1);
      cursor: pointer;
      width: calc(100% - 32px);
      border-radius: 0;
      transition: background 0.12s ease;
    }
    .sheet-cancel:active { background: var(--card-bg); }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.78);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 60;

              </span>
            </div>
            <div class="actions-right">
              <button class="action-btn ${a.liked ? 'liked' : ''}" data-action="like" data-id="${a.id}" onclick="event.stopPropagation();toggleLike(${a.id}, this)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="${a.liked ? '#E72737':'none'}">
                  <path d="M12 21C9 18 4 14.5 4 9.5C4 6.46 6.46 4 9.5 4C11.04 4 12.42 4.7 13.34 5.81C14.26 4.7 15.64 4 17.18 4C20.22 4 22.68 6.46 22.68 9.5C22.68 14.5 17.68 18 14.68 21" stroke="${a.liked ? '#E72737' : '#999'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1.34,0)"/>
                </svg>
                <span class="num-font" data-likes>${fmtCount(a.likes)}</span>
              </button>
              <button class="action-btn" data-action="share" data-id="${a.id}" onclick="event.stopPropagation();openShare(${a.id})">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M4 12V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V12" stroke="#999" stroke-width="1.6" stroke-linecap="round"/>
                  <path d="M12 4V16M12 4L8 8M12 4L16 8" stroke="#999" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>分享</span>
              </button>
            </div>
          </div>
        </article>
      `).join('');
    };
    renderArticles();

    // ============ 文章卡片点击：跳转占位页（浏览量 +1 仅做视觉同步）============
    window.openArticle = (id) => {
      const a = articles.find(x => x.id === id);
      if (!a) return;
      a.views += 1;
      // 跳转占位页
      window.location.href = '_placeholder.html';
    };

    // ============ 快速点赞 ============
    window.toggleLike = (id, btn) => {
      const a = articles.find(x => x.id === id);
      if (!a) return;
      a.liked = !a.liked;
      a.likes += a.liked ? 1 : -1;
      btn.classList.toggle('liked', a.liked);
      // 更换图标填充
      const svgPath = btn.querySelector('svg path');
      svgPath.setAttribute('stroke', a.liked ? '#E72737' : '#999');
      btn.querySelector('svg').setAttribute('fill', a.liked ? '#E72737' : 'none');
      const numEl = btn.querySelector('[data-likes]');
      numEl.textContent = fmtCount(a.likes);
      // 弹跳动效
      btn.querySelector('svg').classList.remove('like-pop');
      void btn.querySelector('svg').offsetWidth;
      btn.querySelector('svg').classList.add('like-pop');
    };

    // ============ 分享面板 ============
    const sheet = document.getElementById('shareSheet');
    const mask = document.getElementById('sheetMask');
    const cancelBtn = document.getElementById('sheetCancel');
    let curShareId = null;
    window.openShare = (id) => {
      curShareId = id;
      sheet.classList.add('show');
      mask.classList.add('show');
    };
    const closeShare = () => {
      sheet.classList.remove('show');
      mask.classList.remove('show');
    };
    mask.addEventListener('click', closeShare);
    cancelBtn.addEventListener('click', closeShare);
    document.querySelectorAll('.share-ch').forEach(ch => {
      ch.addEventListener('click', () => {
        const channel = ch.dataset.ch;
        // 未实现的通道做差异化提示（朋友圈、系统分享标记为"未实现"演示）
        const unimplemented = ['朋友圈', '系统分享'];
        const msg = unimplemented.includes(channel) ? `${channel}：未实现` : `${channel}：分享成功`;
        showToast(msg);
        closeShare();
      });
    });

    // ============ Toast ============
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    const showToast = (text) => {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    };

    // ============ Banner 轮播 ============
    const track = document.getElementById('bannerTrack');
    const dots = document.querySelectorAll('#bannerDots .dot');
    const total = dots.length;
    let curIdx = 0;
    let autoTimer = null;

    const goTo = (idx) => {
      curIdx = (idx + total) % total;
      track.style.transform = `translateX(-${curIdx * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === curIdx));
    };
    const startAuto = () => {
      stopAuto();
      autoTimer = setInterval(() => goTo(curIdx + 1), 4000);
    };
    const stopAuto = () => { if (autoTimer) clearInterval(autoTimer); };
    startAuto();

    // 手势滑动支持
    const viewport = document.getElementById('bannerViewport');
    let startX = 0, startY = 0, dx = 0, dragging = false;
    viewport.addEventListener('touchstart', e => {
      stopAuto();
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      dx = 0; dragging = true;
      track.style.transition = 'none';
    }, { passive: true });
    viewport.addEventListener('touchmove', e => {
      if (!dragging) return;
      dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      // 只在水平滑动主导时拦截
      if (Math.abs(dx) > Math.abs(dy)) {
        const w = viewport.offsetWidth;
        track.style.transform = `translateX(${-curIdx * 100 - (dx / w * 100)}%)`;
      }
    }, { passive: true });
    viewport.addEventListener('touchend', () => {
      if (!dragging) return;
      track.style.transition = '';
      dragging = false;
      if (Math.abs(dx) > 50) {
        goTo(curIdx + (dx < 0 ? 1 : -1));
      } else {
        goTo(curIdx);
      }
      startAuto();
    });
    // 鼠标拖拽（PC 预览支持）
    let mDown = false;
    viewport.addEventListener('mousedown', e => {
      mDown = true; stopAuto();
      startX = e.clientX; dx = 0;
      track.style.transition = 'none';
    });
    window.addEventListener('mousemove', e => {
      if (!mDown) return;
      dx = e.clientX - startX;
      const w = viewport.offsetWidth;
      track.style.transform = `translateX(${-curIdx * 100 - (dx / w * 100)}%)`;
    });
    window.addEventListener('mouseup', () => {
      if (!mDown) return;
      mDown = false;
      track.style.transition = '';
      if (Math.abs(dx) > 50) goTo(curIdx + (dx < 0 ? 1 : -1));
      else goTo(curIdx);
      startAuto();
    });

    // 进度条入场动画
    requestAnimationFrame(() => {
      document.getElementById('lvProgress').style.width = (230/630*100).toFixed(1) + '%';
    });

    // 滚动监听：火象专栏标题吸顶时增加阴影
    const scrollArea = document.getElementById('scrollArea');
    const colHeader = document.getElementById('columnHeader');
    scrollArea.addEventListener('scroll', () => {
      const rect = colHeader.getBoundingClientRect();
      const parentRect = scrollArea.getBoundingClientRect();
      const stickyTop = 44 + parentRect.top;
      colHeader.classList.toggle('stuck', rect.top <= stickyTop + 1);
    });
  </script>
</body>
</html>
