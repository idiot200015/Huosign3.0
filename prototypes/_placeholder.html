<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>页面建设中 - 火象 3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --brand: #E72737;
      --brand-deep: #C51826;
      --brand-soft-1: #FFE2E4;
      --brand-soft-2: #FFE9EC;
      --text-1: #333333;
      --text-2: #666666;
      --text-3: #999999;
      --bg-page: #F8F9FC;
      --line: #E9EDF4;
    }
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-1);
    }
    body { background: #cccccc; }
    .phone {
      max-width: 375px;
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg-page);
      position: relative;
      overflow: hidden;
    }
    .top-bar {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      color: var(--text-1);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 6px 8px 6px 0;
      transition: opacity 0.15s ease;
    }
    .back-btn:active { opacity: 0.5; }
    .content {
      padding: 80px 32px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .illustration {
      width: 220px;
      height: 220px;
      margin-bottom: 32px;
      filter: drop-shadow(0 12px 24px rgba(231, 39, 55, 0.18));
      animation: float 3.6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .title-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-1);
      margin-bottom: 12px;
    }
    .sub-text {
      font-size: 14px;
      color: var(--text-3);
      line-height: 22px;
    }
    .badge-row {
      margin-top: 28px;
      padding: 8px 16px;
      background: var(--brand-soft-1);
      border-radius: 999px;
      color: var(--brand);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="top-bar">
      <button class="back-btn" onclick="history.length > 1 ? history.back() : (location.href='index.html')">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 4L6.5 10L12.5 16" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>返回</span>
      </button>
    </header>

    <main class="content">
      <!-- 自定义 SVG 插画：抱着图纸的小狐狸（用品牌红渐变 mock） -->
      <svg class="illustration" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgCircle" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFE9EC"/>
            <stop offset="100%" stop-color="#FFE2E4"/>
          </linearGradient>
          <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E72737"/>
            <stop offset="100%" stop-color="#C51826"/>
          </linearGradient>
          <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#F0F2F8"/>
          </linearGradient>
        </defs>
        <circle cx="110" cy="110" r="100" fill="url(#bgCircle)"/>
        <!-- 工具箱底 -->
        <rect x="50" y="105" width="120" height="68" rx="10" fill="url(#boxGrad)"/>
        <rect x="50" y="105" width="120" height="14" rx="6" fill="#C51826"/>
        <!-- 提手 -->
        <rect x="92" y="86" width="36" height="22" rx="6" fill="none" stroke="#C51826" stroke-width="4"/>
        <!-- 工具：扳手 -->
        <g transform="translate(70 130) rotate(-25)">
          <rect x="0" y="0" width="50" height="8" rx="3" fill="#fff"/>
          <circle cx="50" cy="4" r="8" fill="none" stroke="#fff" stroke-width="3"/>
        </g>
        <!-- 工具：螺丝刀 -->
        <g transform="translate(115 138) rotate(20)">
          <rect x="0" y="0" width="34" height="6" rx="2" fill="#FFE2E4"/>
          <rect x="34" y="-2" width="14" height="10" rx="2" fill="#FFE2E4"/>
        </g>
        <!-- 飘落的纸片 -->
        <rect x="40" y="40" width="36" height="44" rx="4" fill="url(#paperGrad)" stroke="#E9EDF4" stroke-width="1" transform="rotate(-15 58 62)"/>
        <line x1="46" y1="52" x2="68" y2="52" stroke="#D1D1D1" stroke-width="1.5" transform="rotate(-15 58 62)"/>
        <line x1="46" y1="60" x2="62" y2="60" stroke="#D1D1D1" stroke-width="1.5" transform="rotate(-15 58 62)"/>
        <rect x="148" y="50" width="32" height="40" rx="4" fill="url(#paperGrad)" stroke="#E9EDF4" stroke-width="1" transform="rotate(18 164 70)"/>
        <line x1="154" y1="62" x2="174" y2="62" stroke="#D1D1D1" stroke-width="1.5" transform="rotate(18 164 70)"/>
        <line x1="154" y1="70" x2="170" y2="70" stroke="#D1D1D1" stroke-width="1.5" transform="rotate(18 164 70)"/>
        <!-- 闪光 -->
        <g fill="#E72737">
          <circle cx="38" cy="100" r="3"/>
          <circle cx="184" cy="120" r="2.4"/>
          <circle cx="170" cy="170" r="2"/>
          <circle cx="46" cy="170" r="2.6"/>
        </g>
      </svg>

      <div class="title-text">这个页面还没做好哦~</div>
      <div class="sub-text">我们正在加紧设计，敬请期待</div>
      <div class="badge-row">🚧 火象 3.0 原型建设中</div>
    </main>
  </div>
</body>
</html>
