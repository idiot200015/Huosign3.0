<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>邀请管理系统 - OA 后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    font-size: 14px;
    color: #1f2937;
    background: #f5f7fa;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input { font-family: inherit; outline: none; }
  table { border-collapse: collapse; width: 100%; }

  /* ===== Layout ===== */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "sidebar header"
      "sidebar main";
    height: 100vh;
  }
  .sidebar {
    grid-area: sidebar;
    background: #1f2a44;
    color: #cbd5e1;
    padding: 20px 0;
    overflow-y: auto;
  }
  .sidebar-title {
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    padding: 0 20px 18px;
    border-bottom: 1px solid #2d3a5a;
    margin-bottom: 12px;
  }
  .nav-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 20px;
    color: #cbd5e1;
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover { background: #2a3656; color: #fff; }
  .nav-item.active {
    background: #2a3656;
    color: #fff;
    border-left-color: #3b82f6;
  }

  .header {
    grid-area: header;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }
  .header-title { font-size: 16px; font-weight: 600; color: #1f2937; }
  .header-user {
    display: flex; align-items: center; gap: 10px;
  }
  .header-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #60a5fa, #3b82f6);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }

  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 20px 24px;
  }

  /* ===== Common Card ===== */
  .card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  /* ===== Buttons ===== */
  .btn {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    border: 1px solid #d1d5db;
    background: #fff;
    color: #374151;
    transition: all 0.15s;
  }
  .btn:hover { border-color: #3b82f6; color: #3b82f6; }
  .btn-primary {
    background: #3b82f6;
    color: #fff;
    border-color: #3b82f6;
  }
  .btn-primary:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn-ghost {
    background: transparent; border-color: #d1d5db; color: #4b5563;
  }
  .btn-ghost.active {
    background: #eff6ff; border-color: #3b82f6; color: #3b82f6;
  }

  /* ===== Inputs ===== */
  .input {
    height: 32px;
    padding: 0 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
    color: #1f2937;
    background: #fff;
  }
  .input:focus { border-color: #3b82f6; }

  /* ===== Empty state ===== */
  .empty {
    padding: 60px 0;
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
  }

  /* ===== Page placeholder (will be filled in next phases) ===== */
  .page-placeholder {
    padding: 40px;
    color: #6b7280;
    font-size: 14px;
    text-align: center;
  }

  /* ===== Time filter bar ===== */
  .time-filter-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
    position: relative;
  }
  .time-filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    position: relative;
  }
  .time-btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    border: 1px solid #d1d5db;
    background: #fff;
    color: #4b5563;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .time-btn:hover { border-color: #3b82f6; color: #3b82f6; }
  .time-btn.active {
    background: #3b82f6; border-color: #3b82f6; color: #fff;
  }

  /* ===== Date picker popover ===== */
  .date-popover {
    position: absolute;
    top: calc(100% + 8px);
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    padding: 16px;
    z-index: 50;
    width: 360px;
  }
  .date-popover .row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .date-popover label {
    width: 70px; font-size: 13px; color: #374151;
  }
  .date-popover input[type="datetime-local"] {
    flex: 1;
    height: 32px;
    padding: 0 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .date-popover .actions {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 12px; border-top: 1px solid #f3f4f6; padding-top: 12px;
  }

  /* ===== Metric cards ===== */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .metric-card {
    background: #fff;
    border-radius: 8px;
    padding: 18px 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .metric-label { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
  .metric-value { font-size: 26px; font-weight: 600; color: #1f2937; }

  /* ===== Search bar ===== */
  .search-bar {
    background: #fff;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: center;
  }
  .search-field {
    display: flex; align-items: center; gap: 8px;
  }
  .search-field label {
    font-size: 13px; color: #4b5563; white-space: nowrap;
  }
  .search-field .input { width: 180px; }
  .search-field .input.small { width: 150px; }
  .date-range {
    display: flex; align-items: center; gap: 6px;
  }
  .date-range .input { width: 150px; }

  /* ===== List card / table ===== */
  .list-card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .list-header {
    padding: 14px 20px;
    border-bottom: 1px solid #f0f1f3;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 6px;
  }
  .list-title {
    font-weight: 600; font-size: 15px; color: #1f2937;
  }

  /* ===== Breadcrumb ===== */
  .breadcrumb {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 4px;
    width: 100%;
  }
  .crumb-root {
    font-size: 15px;
    font-weight: 600;
    color: #1f2937;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
  }
  .crumb-root:hover { color: #3b82f6; background: #f3f4f6; }
  .crumb-sep {
    color: #9ca3af;
    font-size: 14px;
    user-select: none;
  }
  .crumb-item {
    font-size: 14px;
    color: #4b5563;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .crumb-item:hover { color: #3b82f6; background: #f3f4f6; }
  .crumb-item.last {
    background: #eff6ff;
    color: #1d4ed8;
    cursor: default;
    padding-right: 4px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .crumb-item.last:hover { background: #eff6ff; color: #1d4ed8; }
  .crumb-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    color: #6b7280;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s;
  }
  .crumb-close:hover { background: #dbeafe; color: #1d4ed8; }
  .data-table {
    width: 100%;
    font-size: 13px;
  }
  .data-table thead th {
    background: #f8fafc;
    color: #4b5563;
    text-align: left;
    padding: 10px 14px;
    font-weight: 500;
    border-bottom: 1px solid #e5e7eb;
    white-space: nowrap;
  }
  .data-table tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid #f3f4f6;
    color: #1f2937;
    vertical-align: middle;
  }
  .data-table tbody tr:hover { background: #f9fafb; }
  .data-table tbody tr:last-child td { border-bottom: none; }

  .col-sortable {
    cursor: pointer; user-select: none;
  }
  .col-sortable:hover { color: #3b82f6; }
  .sort-ico {
    display: inline-block;
    margin-left: 4px;
    color: #cbd5e1;
    font-size: 10px;
    line-height: 1;
  }
  .sort-ico.active { color: #3b82f6; }

  .user-cell {
    display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .nickname { color: #1f2937; }

  .level-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    line-height: 18px;
    white-space: nowrap;
  }
  .level-1 { background: #dbeafe; color: #1d4ed8; }
  .level-2 { background: #d1fae5; color: #047857; }
  .level-3 { background: #ede9fe; color: #6d28d9; }
  .level-4 { background: #ffedd5; color: #c2410c; }
  .level-5 { background: #fee2e2; color: #b91c1c; }
  .level-user { background: #f3f4f6; color: #6b7280; }

  .link-num {
    color: #3b82f6;
    cursor: pointer;
    text-decoration: underline;
  }
  .link-num:hover { color: #2563eb; }
  .muted { color: #9ca3af; }

  /* ===== Pagination ===== */
  .pagination {
    padding: 14px 20px;
    border-top: 1px solid #f0f1f3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: nowrap;
  }
  .page-size select {
    height: 30px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 0 8px;
    font-size: 13px;
    background: #fff;
    color: #374151;
    font-family: inherit;
  }
  .page-buttons {
    display: flex; align-items: center; gap: 4px;
  }
  .page-btn {
    min-width: 30px;
    height: 30px;
    padding: 0 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #fff;
    font-size: 13px;
    color: #374151;
  }
  .page-btn:hover:not(:disabled) { border-color: #3b82f6; color: #3b82f6; }
  .page-btn.active {
    background: #3b82f6; border-color: #3b82f6; color: #fff;
  }
  .page-btn:disabled {
    color: #cbd5e1; cursor: not-allowed; background: #f9fafb;
  }
  .page-total { color: #6b7280; font-size: 13px; white-space: nowrap; }

  /* ===== Page top bar (title + actions) ===== */
  .page-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .page-top h2 {
    font-size: 18px; font-weight: 600; color: #1f2937;
  }

  /* ===== Tabs ===== */
  .tabs {
    display: flex;
    gap: 6px;
    background: #fff;
    padding: 6px 12px;
    border-radius: 8px 8px 0 0;
    border-bottom: 1px solid #f0f1f3;
  }
  .tab {
    padding: 8px 18px;
    font-size: 14px;
    color: #4b5563;
    border-radius: 6px 6px 0 0;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab:hover { color: #3b82f6; }
  .tab.active {
    color: #3b82f6;
    border-bottom-color: #3b82f6;
    font-weight: 600;
  }

  /* ===== Status tag ===== */
  .status-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    line-height: 18px;
  }
  .status-verified  { background: #d1fae5; color: #047857; }
  .status-unverified { background: #fee2e2; color: #b91c1c; }

  /* ===== Modal description list ===== */
  .modal-info {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 6px;
    padding: 12px 14px;
    color: #1e40af;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .modal-info ul { margin: 6px 0 0 18px; }
  .modal-tip { color: #6b7280; font-size: 13px; }

  /* ===== Modal ===== */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal {
    background: #fff;
    border-radius: 8px;
    min-width: 460px;
    max-width: 560px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .modal-header {
    padding: 14px 20px;
    border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; font-size: 15px;
  }
  .modal-close {
    color: #9ca3af; font-size: 18px; line-height: 1;
  }
  .modal-close:hover { color: #4b5563; }
  .modal-body { padding: 20px; font-size: 14px; color: #374151; line-height: 1.7; }
  .modal-footer {
    padding: 12px 20px;
    border-top: 1px solid #e5e7eb;
    display: flex; justify-content: flex-end; gap: 10px;
  }
</style>
</head>
<body>

<div id="app" class="app">
  <aside class="sidebar">
    <div class="sidebar-title">邀请管理系统</div>
    <nav id="nav"></nav>
  </aside>

  <header class="header">
    <div id="header-title" class="header-title">代理列表</div>
    <div class="header-user">
      <span style="color:#6b7280;">运营管理员</span>
      <div class="header-avatar">OA</div>
    </div>
  </header>

  <main id="main" class="main">
    <div class="page-placeholder">页面加载中…</div>
  </main>
</div>

<div id="modal-root"></div>

<script>
'use strict';

/* ============================================================
 * State
 * ============================================================ */
const State = {
  currentPage: 'agents',           // 'agents' | 'settlements' | 'bonus'
  breadcrumb: [],                  // [{id, name}] - excluding the root "代理列表"
  agents: {
    timeFilter: 'all',             // 'today' | 'week' | 'month' | 'all' | 'custom'
    customRange: null,             // { start: Date, end: Date }
    showDatePopover: false,
    draftCustomStart: '',          // string in datetime-local format with seconds
    draftCustomEnd: '',
    search: { phone: '', name: '', dateFrom: '', dateTo: '' },
    sortKey: '',                   // column key
    sortDir: 'desc',               // 'asc' | 'desc'
    page: 1,
    pageSize: 20,
  },
  settlements: {
    tab: 'pending',                // 'pending' | 'approved'
    pendingSearch: { phone: '', name: '' },
    approvedSearch: { phone: '', name: '', dateFrom: '', dateTo: '' },
    page: 1,
    pageSize: 20,
  },
  bonus: {
    orderInput: '',                // current input value (uncommitted)
    queriedOrder: '',              // order id that has been searched (drives results)
    page: 1,
    pageSize: 20,
  },
  modal: null,                     // { type, payload }
};

/* ============================================================
 * Mock Data (skeleton; expanded in later phases)
 * ============================================================ */
const Mock = {
  // Tree of people. Agents have isAgent=true, regular users have isAgent=false.
  // Each node has: id, name, phone, avatar, level, becomeAgentTime, totalPaid,
  // totalReward, balance, parentId, childrenIds.
  people: {},
  // settlements: pending and approved
  settlements: { pending: [], approved: [] },
  // bonusByOrder: orderId -> [{time, userId, amount}]
  bonusByOrder: {},
};

/* ============================================================
 * Utilities
 * ============================================================ */
function el(tag, attrs, children) {
  // Allow shorthand: el(tag, [child, child]) treats array as children, no attrs
  if (Array.isArray(attrs)) { children = attrs; attrs = null; }
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'style') node.setAttribute('style', attrs[k]);
      else if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.startsWith('on') && typeof attrs[k] === 'function') {
        node.addEventListener(k.substring(2).toLowerCase(), attrs[k]);
      } else if (attrs[k] !== undefined && attrs[k] !== null) {
        node.setAttribute(k, attrs[k]);
      }
    }
  }
  if (children) {
    if (!Array.isArray(children)) children = [children];
    for (const c of children) {
      if (c == null) continue;
      if (typeof c === 'string' || typeof c === 'number') {
        node.appendChild(document.createTextNode(String(c)));
      } else {
        node.appendChild(c);
      }
    }
  }
  return node;
}

function fmtMoney(n) {
  if (n == null || n === '-') return '-';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  return sign + '¥' + abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtNumber(n) {
  if (n == null || n === '-') return '-';
  return n.toLocaleString('en-US');
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function fmtDateTime(d) {
  if (!d) return '-';
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate())
    + ' ' + pad2(dt.getHours()) + ':' + pad2(dt.getMinutes()) + ':' + pad2(dt.getSeconds());
}

function fmtDate(d) {
  if (!d) return '-';
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
}

function avatarColor(seed) {
  const colors = ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#ef4444', '#06b6d4', '#ec4899', '#6366f1'];
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return colors[h % colors.length];
}

/* ============================================================
 * Mock data generation
 * ============================================================ */
(function buildMockData() {
  const surnames = ['张','李','王','赵','陈','刘','杨','黄','周','吴','徐','孙','胡','朱','高','林','何','郭','马','罗'];
  const givens = ['小明','晓峰','子轩','梓涵','雨萱','浩然','一鸣','嘉怡','思远','若曦','睿杰','欣怡','博文','子墨','雅婷','志强','晨曦','梓豪','慧敏','二'];
  let pid = 1;
  function makeId() { return 'P' + (pid++).toString().padStart(4, '0'); }
  function randPhone() {
    let s = '1' + (Math.floor(Math.random() * 9) + 1);
    for (let i = 0; i < 9; i++) s += Math.floor(Math.random() * 10);
    return s;
  }
  function randDate(daysAgoMax) {
    const now = Date.now();
    const offset = Math.floor(Math.random() * daysAgoMax * 24 * 3600 * 1000);
    return new Date(now - offset);
  }

  // Random unique name generator
  const usedNames = new Set();
  function uniqueName() {
    let tries = 0;
    while (tries < 50) {
      const n = surnames[Math.floor(Math.random() * surnames.length)] + givens[Math.floor(Math.random() * givens.length)];
      if (!usedNames.has(n)) { usedNames.add(n); return n; }
      tries++;
    }
    return '用户' + pid;
  }

  function makePerson(opts) {
    const isAgent = opts.isAgent;
    const id = makeId();
    const name = opts.name || uniqueName();
    const totalPaid = isAgent
      ? Math.round((Math.random() * 6000 + 200) * 100) / 100
      : Math.round((Math.random() * 2000) * 100) / 100;
    const person = {
      id,
      name,
      phone: randPhone(),
      avatar: name.charAt(0),
      isAgent,
      level: opts.level || 0,             // agent level (1,2,3...) or 0 for regular user
      parentId: opts.parentId || null,
      childrenIds: [],
      totalPaid,
      totalReward: isAgent ? Math.round((Math.random() * 4000) * 100) / 100 : 0,
      balance: 0,
      becomeAgentTime: isAgent ? randDate(opts.daysAgoMax || 180) : null,
      // settlement related
      realName: opts.realName || (name.length === 2 ? name : name),
      verified: isAgent ? (Math.random() > 0.3) : false,
      alipayName: '',
      alipayAccount: '',
    };
    person.balance = isAgent ? Math.round((person.totalReward * (Math.random() * 0.6 + 0.2)) * 100) / 100 : 0;
    if (isAgent && person.verified) {
      person.alipayName = person.realName;
      person.alipayAccount = (Math.random() > 0.5)
        ? person.phone
        : (person.name + '@example.com');
    }
    Mock.people[id] = person;
    return person;
  }

  // Build a tree.  Top-level agents (level 1) — 8 people.
  const topAgents = [];
  for (let i = 0; i < 8; i++) {
    topAgents.push(makePerson({ isAgent: true, level: 1, daysAgoMax: 180 }));
  }
  // Force first three top-level agents to specific names so screenshots match the spec example
  topAgents[0].name = '张小明'; topAgents[0].avatar = '张';
  topAgents[1].name = '周杰';   topAgents[1].avatar = '周';
  topAgents[2].name = '李晓峰'; topAgents[2].avatar = '李';

  function addChildren(parent, agentCount, userCount, childLevel) {
    for (let i = 0; i < agentCount; i++) {
      const c = makePerson({
        isAgent: true,
        level: childLevel,
        parentId: parent.id,
        daysAgoMax: 120,
      });
      parent.childrenIds.push(c.id);
    }
    for (let i = 0; i < userCount; i++) {
      const c = makePerson({
        isAgent: false,
        level: 0,
        parentId: parent.id,
      });
      parent.childrenIds.push(c.id);
    }
  }

  // Special: first top agent gets a richer subtree
  const a1 = topAgents[0];                               // 张小明 (level 1)
  addChildren(a1, 4, 3, 2);                              // 4 agents + 3 users
  // Force one of a1's child agents to be "周杰" so 张小明 > 周杰 path works
  const a1FirstChild = Mock.people[a1.childrenIds[0]];
  a1FirstChild.name = '周杰'; a1FirstChild.avatar = '周';
  addChildren(a1FirstChild, 3, 2, 3);                    // level 3 children
  const a1GrandChild = Mock.people[a1FirstChild.childrenIds[0]];
  a1GrandChild.name = '李晓峰'; a1GrandChild.avatar = '李';
  addChildren(a1GrandChild, 2, 2, 4);
  const a1GreatGrand = Mock.people[a1GrandChild.childrenIds[0]];
  a1GreatGrand.name = '王二'; a1GreatGrand.avatar = '王';
  addChildren(a1GreatGrand, 1, 3, 5);

  // Other top agents
  for (let i = 1; i < topAgents.length; i++) {
    const cAgentCount = 2 + Math.floor(Math.random() * 4);
    const cUserCount = 1 + Math.floor(Math.random() * 4);
    addChildren(topAgents[i], cAgentCount, cUserCount, 2);
    // Give some grandchildren too
    for (const cid of topAgents[i].childrenIds) {
      const c = Mock.people[cid];
      if (c.isAgent && Math.random() > 0.4) {
        addChildren(c, Math.floor(Math.random() * 3), Math.floor(Math.random() * 3), 3);
      }
    }
  }

  // Compute team totals (number of all descendants)
  function computeTeamTotal(p) {
    let cnt = 0;
    for (const cid of p.childrenIds) {
      cnt += 1 + computeTeamTotal(Mock.people[cid]);
    }
    p.teamTotal = cnt;
    return cnt;
  }
  for (const id in Mock.people) {
    const p = Mock.people[id];
    if (!p.parentId) computeTeamTotal(p);
  }
  // After full pass, everyone has teamTotal set (recursive call sets all)
  for (const id in Mock.people) {
    const p = Mock.people[id];
    if (p.teamTotal == null) p.teamTotal = 0;
    p.directInvites = p.childrenIds.length;
  }

  // Build settlements: pick agents with balance >= 200 OR a few "first-time"
  const allAgents = Object.values(Mock.people).filter(x => x.isAgent);
  // pending list
  const pendingPicks = [];
  // first-timers: even with low balance, include some
  const firstTimers = allAgents.filter(a => a.balance < 200).slice(0, 4);
  const eligible = allAgents.filter(a => a.balance >= 200);
  pendingPicks.push(...firstTimers, ...eligible);
  // dedupe
  const seen = new Set();
  let serial = 1;
  for (const a of pendingPicks) {
    if (seen.has(a.id)) continue;
    seen.add(a.id);
    Mock.settlements.pending.push({
      serial: serial++,
      agentId: a.id,
      amount: a.balance > 0 ? a.balance : Math.round((Math.random() * 150 + 20) * 100) / 100,
    });
  }
  // approved list (mock a few historical ones)
  for (let i = 0; i < 6; i++) {
    const a = allAgents[Math.floor(Math.random() * allAgents.length)];
    Mock.settlements.approved.push({
      serial: i + 1,
      agentId: a.id,
      amount: Math.round((Math.random() * 1500 + 200) * 100) / 100,
      approvedAt: randDate(60),
    });
  }

  // Build bonus records keyed by orderId.
  // For each order: a regular user pays, and the chain of agents above gets reward.
  const orderIds = ['ORD20260115001', 'ORD20260301002', 'ORD20260328003', 'ORD20260420004'];
  for (const orderId of orderIds) {
    const users = Object.values(Mock.people).filter(p => !p.isAgent && p.parentId);
    if (!users.length) continue;
    const buyer = users[Math.floor(Math.random() * users.length)];
    const records = [];
    let cur = Mock.people[buyer.parentId];
    let levelUp = 0;
    while (cur) {
      const amount = levelUp === 0
        ? Math.round((Math.random() * 80 + 30) * 100) / 100
        : Math.round((Math.random() * 30 + 5) * 100) / 100;
      records.push({
        time: randDate(30),
        userId: cur.id,
        amount,
      });
      levelUp++;
      cur = cur.parentId ? Mock.people[cur.parentId] : null;
    }
    Mock.bonusByOrder[orderId] = records;
  }
})();

    const ps = State.settlements.pageSize;
    const page = clampPage(State.settlements.page, total, ps);
    const slice = items.slice((page - 1) * ps, (page - 1) * ps + ps);
    card.appendChild(renderPendingTable(slice));
    card.appendChild(renderPagination(total, page, ps, paginationSettlementsCb));

    card.appendChild(renderApprovedSearchBar());
    const items = applyApprovedFilter(Mock.settlements.approved);

    card.appendChild(renderPagination(total, page, ps, paginationSettlementsCb));

function paginationSettlementsCb(newPage, newSize) {
  if (newSize != null) {
    State.settlements.pageSize = newSize;
    State.settlements.page = 1;
  } else {
    State.settlements.page = newPage;
  }
  renderApp();
}

function clampPage(page, total, pageSize) {
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (page > totalPages) return totalPages;
  if (page < 1) return 1;
  return page;
}

function applyPendingFilter(list) {
  const s = State.settlements.pendingSearch;
  return list.filter(function (row) {
    const p = Mock.people[row.agentId];
    if (!p) return false;
    if (s.phone && !p.phone.includes(s.phone)) return false;
    if (s.name && !p.name.includes(s.name)) return false;
    return true;
  });
}

function applyApprovedFilter(list) {
  const s = State.settlements.approvedSearch;
  return list.filter(function (row) {
    const p = Mock.people[row.agentId];
    if (!p) return false;
    if (s.phone && !p.phone.includes(s.phone)) return false;
    if (s.name && !p.name.includes(s.name)) return false;
    if (s.dateFrom) {
      if (row.approvedAt.getTime() < new Date(s.dateFrom).getTime()) return false;
    }
    if (s.dateTo) {
      const end = new Date(s.dateTo); end.setHours(23, 59, 59, 999);
      if (row.approvedAt.getTime() > end.getTime()) return false;
    }
    return true;
  });
}

/* ============================================================
 * Modal rendering
 * ============================================================ */
function renderModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  if (!State.modal) return;

  if (State.modal.type === 'initiate') {
    root.appendChild(buildInitiateModal());
  } else if (State.modal.type === 'approve') {
    root.appendChild(buildApproveModal(State.modal.payload));
  } else if (State.modal.type === 'toast') {
    root.appendChild(buildToastModal(State.modal.payload));
  }
}

function closeModal() {
  State.modal = null;
  renderApp();
}

function buildInitiateModal() {
  const mask = el('div', { class: 'modal-mask' });
  const modal = el('div', { class: 'modal' });

  modal.appendChild(el('div', { class: 'modal-header' }, [
    el('span', { text: '发起结算' }),
    el('button', { class: 'modal-close', type: 'button', text: '×',
      onclick: closeModal,
    }),
  ]));

  const body = el('div', { class: 'modal-body' });
  const info = el('div', { class: 'modal-info' });
  info.appendChild(document.createTextNode('系统将扫描所有代理生成结算单：'));
  info.appendChild(el('ul', null, [
    el('li', { text: '首次结算的代理：无金额限制，全部进入' }),
    el('li', { text: '非首次结算：余额 ≥ ¥200 的代理才进入' }),
  ]));
  body.appendChild(info);
  body.appendChild(el('div', { class: 'modal-tip',
    text: '门槛金额由系统预设，如需调整请联系开发配置。' }));

  modal.appendChild(el('div', { class: 'modal-footer' }, [
    el('button', { class: 'btn', type: 'button', text: '取消',
      onclick: closeModal,
    }),
    el('button', { class: 'btn btn-primary', type: 'button', text: '确认发起',
      onclick: function () {
        State.modal = { type: 'toast', payload: '已发起结算，扫描完成（mock）。' };
        renderApp();

  mask.appendChild(modal);

function buildApproveModal(payload) {
  const mask = el('div', { class: 'modal-mask' });
  const modal = el('div', { class: 'modal' });
  const p = Mock.people[payload.agentId];

  modal.appendChild(el('div', { class: 'modal-header' }, [
    el('span', { text: '确认通过' }),
    el('button', { class: 'modal-close', type: 'button', text: '×',

    }),
  ]));

  const body = el('div', { class: 'modal-body' });
  body.appendChild(el('div', null, '确认通过该代理的结算？'));
  body.appendChild(el('div', { style: 'margin-top:10px;color:#374151;line-height:1.8;' }, [
    el('div', null, '代理昵称：' + (p ? p.name : '-')),
    el('div', null, '手机号：' + (p ? p.phone : '-')),
    el('div', null, '结算金额：' + fmtMoney(payload.amount)),

/* Get the time-range [start, end) implied by the time filter.
 * Returns null if filter is "全部". */
function getTimeRange() {
  const f = State.agents.timeFilter;
  const now = new Date();
  if (f === 'all') return null;
  if (f === 'today') {
    const s = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const e = new Date(s.getTime() + 24 * 3600 * 1000);
    return { start: s, end: e };
  }
  if (f === 'week') {
    const e = new Date(now);
    const s = new Date(now.getTime() - 7 * 24 * 3600 * 1000);
    return { start: s, end: e };
  }
  if (f === 'month') {
    const s = new Date(now.getFullYear(), now.getMonth(), 1);
    const e = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    return { start: s, end: e };
  }
  if (f === 'custom' && State.agents.customRange) {
    return State.agents.customRange;
  }
  return null;
}

/* Compute three metrics based on time range. Mock approximation. */
function computeAgentMetrics() {
  const range = getTimeRange();
  const allAgents = Object.values(Mock.people).filter(p => p.isAgent);
  if (!range) {
    const totalAgents = allAgents.length;
    const totalReward = allAgents.reduce((s, a) => s + a.totalReward, 0);
    // 已发放 = totalReward - balance（已结算/未结算的差额估算）
    const totalPaidOut = allAgents.reduce((s, a) => s + Math.max(0, a.totalReward - a.balance), 0);
    return {
      label1: '代理总人数',     value1: fmtNumber(totalAgents),
      label2: '累计总奖励',     value2: fmtMoney(totalReward),
      label3: '已发放奖励',     value3: fmtMoney(totalPaidOut),
    };
  }
  const inRange = function (d) {
    if (!d) return false;
    const t = (d instanceof Date ? d : new Date(d)).getTime();
    return t >= range.start.getTime() && t < range.end.getTime();
  };
  const newAgents = allAgents.filter(a => inRange(a.becomeAgentTime)).length;
  // mock 随机但稳定：根据范围长度按比例计算
  const days = Math.max(1, (range.end.getTime() - range.start.getTime()) / 86400000);
  const allRewardSum = allAgents.reduce((s, a) => s + a.totalReward, 0);
  const allPaidSum = allAgents.reduce((s, a) => s + Math.max(0, a.totalReward - a.balance), 0);
  const factor = Math.min(1, days / 180);
  const newReward = Math.round(allRewardSum * factor * 0.6 * 100) / 100;
  const newPaid = Math.round(allPaidSum * factor * 0.55 * 100) / 100;
  return {
    label1: '该时段新增代理数', value1: fmtNumber(newAgents),
    label2: '该时段新产生奖励', value2: fmtMoney(newReward),
    label3: '该时段完成发放金额', value3: fmtMoney(newPaid),
  };
}

/* Get the list of people to show.
 * No breadcrumb -> all agents (no regular users).
 * With breadcrumb -> direct children of last breadcrumb agent (mix in regular users). */
function getDisplayedPeople() {
  if (!State.breadcrumb.length) {
    return Object.values(Mock.people).filter(p => p.isAgent);
  }
  const last = State.breadcrumb[State.breadcrumb.length - 1];
  const parent = Mock.people[last.id];
  if (!parent) return [];
  return parent.childrenIds.map(id => Mock.people[id]);
}

/* Apply search-bar filters to the people list */
function applyAgentSearch(list) {
  const s = State.agents.search;
  return list.filter(function (p) {
    if (s.phone && !p.phone.includes(s.phone)) return false;
    if (s.name && !p.name.includes(s.name)) return false;
    if (s.dateFrom) {
      if (!p.becomeAgentTime) return false;
      if (p.becomeAgentTime.getTime() < new Date(s.dateFrom).getTime()) return false;
    }
    if (s.dateTo) {
      if (!p.becomeAgentTime) return false;
      const endOfDay = new Date(s.dateTo);
      endOfDay.setHours(23, 59, 59, 999);
      if (p.becomeAgentTime.getTime() > endOfDay.getTime()) return false;
    }
    return true;
  });
}

/* Sort with "-" (regular-user blank fields) always at end */
function applyAgentSort(list) {
  const key = State.agents.sortKey;
  if (!key) return list;
  const dir = State.agents.sortDir === 'asc' ? 1 : -1;
  // For each row, get the sort value; if "-" (e.g., regular user fields), goes last
  function getValue(p) {
    switch (key) {
      case 'directInvites': return p.isAgent ? p.directInvites : null;
      case 'teamTotal':     return p.isAgent ? p.teamTotal : null;
      case 'totalPaid':     return p.totalPaid != null ? p.totalPaid : null;
      case 'totalReward':   return p.isAgent ? p.totalReward : null;
      case 'balance':       return p.isAgent ? p.balance : null;
      default: return null;
    }
  }
  const arr = list.slice();
  arr.sort(function (a, b) {
    const va = getValue(a);
    const vb = getValue(b);
    const aNull = (va == null);
    const bNull = (vb == null);
    if (aNull && bNull) return 0;
    if (aNull) return 1;     // null/"-" always last
    if (bNull) return -1;
    if (va < vb) return -1 * dir;
    if (va > vb) return  1 * dir;
    return 0;
  });
  return arr;
}

function renderAgentsPage(root) {
  const isTeamDetail = State.breadcrumb.length > 0;

  // 团队详情页（面包屑非空）只展示：搜索栏 + 列表 + 分页。
  // 首页代理列表（面包屑为空）展示：时间筛选 + 指标卡片 + 搜索栏 + 列表 + 分页。
  if (!isTeamDetail) {
    root.appendChild(renderTimeFilterRow());
    root.appendChild(renderMetricCards());

function renderTimeFilterRow() {
  const row = el('div', { class: 'time-filter-row' });
  const group = el('div', { class: 'time-filter-group' });

  // 顺序：自定义 / 今日 / 近一周 / 本月 / 全部
  const buttons = [
    { key: 'custom', label: getCustomBtnLabel() },
    { key: 'today',  label: '今日' },
    { key: 'week',   label: '近一周' },
    { key: 'month',  label: '本月' },
    { key: 'all',    label: '全部' },
  ];
  buttons.forEach(function (b) {
    const isActive = State.agents.timeFilter === b.key;
    const btn = el('button', {
      class: 'time-btn' + (isActive ? ' active' : ''),
      type: 'button',
      onclick: function (ev) {
        if (b.key === 'custom') {
          openCustomDatePopover(ev);
        } else {
          State.agents.timeFilter = b.key;
          State.agents.showDatePopover = false;
          renderApp();
        }
      },
    }, b.label);

  });

  row.appendChild(group);

  if (State.agents.showDatePopover) {
    row.appendChild(renderDatePopover());
  }

  return row;

function getCustomBtnLabel() {
  const r = State.agents.customRange;
  if (State.agents.timeFilter === 'custom' && r) {
    return fmtDateTime(r.start) + ' 至 ' + fmtDateTime(r.end);
  }
  return '自定义';
}

function openCustomDatePopover() {
  // toggle popover
  State.agents.showDatePopover = !State.agents.showDatePopover;
  if (State.agents.showDatePopover && State.agents.customRange) {
    State.agents.draftCustomStart = toDateTimeLocal(State.agents.customRange.start);
    State.agents.draftCustomEnd = toDateTimeLocal(State.agents.customRange.end);
  }
  renderApp();
}

function toDateTimeLocal(d) {
  if (!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate())
    + 'T' + pad2(dt.getHours()) + ':' + pad2(dt.getMinutes()) + ':' + pad2(dt.getSeconds());
}

function renderDatePopover() {
  const pop = el('div', { class: 'date-popover' });

  const startInput = el('input', {
    type: 'datetime-local',
    step: '1',
    value: State.agents.draftCustomStart,
    onchange: function (ev) {
      State.agents.draftCustomStart = ev.target.value;
    },
  });
  const endInput = el('input', {
    type: 'datetime-local',
    step: '1',
    value: State.agents.draftCustomEnd,
    onchange: function (ev) {
      State.agents.draftCustomEnd = ev.target.value;
    },
  });

  pop.appendChild(el('div', { class: 'row' }, [
    el('label', { text: '开始时间' }),
    startInput,
  ]));
  pop.appendChild(el('div', { class: 'row' }, [
    el('label', { text: '结束时间' }),
    endInput,
  ]));

  pop.appendChild(el('div', { class: 'actions' }, [
    el('button', {
      class: 'btn',
      type: 'button',
      onclick: function () {
        State.agents.draftCustomStart = '';
        State.agents.draftCustomEnd = '';
        renderApp();
      },
    }, '重置'),
    el('button', {
      class: 'btn btn-primary',
      type: 'button',
      onclick: function () {
        const s = State.agents.draftCustomStart;
        const e = State.agents.draftCustomEnd;
        if (!s || !e) {
          State.agents.showDatePopover = false;
          renderApp();
          return;
        }
        const sd = new Date(s);
        const ed = new Date(e);
        if (isNaN(sd.getTime()) || isNaN(ed.getTime())) {
          State.agents.showDatePopover = false;
          renderApp();
          return;
        }
        State.agents.timeFilter = 'custom';
        State.agents.customRange = { start: sd, end: ed };
        State.agents.showDatePopover = false;
        renderApp();
      },
    }, '确定'),
  ]));

  return pop;
}

/* Drill into a team — push agent onto breadcrumb. */
function drillIntoTeam(agent) {
  // Avoid duplicate push if user accidentally re-clicks
  const last = State.breadcrumb[State.breadcrumb.length - 1];
  if (!last || last.id !== agent.id) {
    State.breadcrumb.push({ id: agent.id, name: agent.name });
  }
  State.agents.page = 1;
  // Reset sort so listing the new team starts fresh; keep search untouched.
  renderApp();
}

/* ============================================================
 * Breadcrumb
 * ============================================================ */
function renderBreadcrumb() {
  const wrap = el('div', { class: 'breadcrumb' });

  // Root: 代理列表
  const root = el('span', {
    class: 'crumb-root',
    text: '代理列表',

  // Separators + crumb items
  State.breadcrumb.forEach(function (c, idx) {

      lastSpan.appendChild(document.createTextNode(c.name));
      lastSpan.appendChild(el('span', {

          State.agents.page = 1;
          renderApp();
        },

/* Generic pagination renderer. onChange(newPage, newPageSize | null) */
function renderPagination(total, page, pageSize, onChange) {
  const wrap = el('div', { class: 'pagination' });

  // Left: page-size selector
  const sizeWrap = el('div', { class: 'page-size' });
  const select = el('select', {
    onchange: function (ev) {
      onChange(1, parseInt(ev.target.value, 10));
    },
  });
  [20, 50, 100, 500].forEach(function (sz) {
    const opt = el('option', { value: String(sz), text: '每页 ' + sz + ' 条' });
    if (sz === pageSize) opt.selected = true;
    select.appendChild(opt);
  });
  sizeWrap.appendChild(select);
  wrap.appendChild(sizeWrap);

  // Middle: page buttons
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const pBtns = el('div', { class: 'page-buttons' });
  pBtns.appendChild(el('button', {
    class: 'page-btn',
    type: 'button',
    disabled: page <= 1 ? 'disabled' : null,
    onclick: function () { if (page > 1) onChange(page - 1, null); },
  }, '‹ 上一页'));

  // Page numbers (compact: show up to 5 numbers around current)
  const pageNums = computePageNumbers(page, totalPages, 5);
  pageNums.forEach(function (n) {
    if (n === '...') {
      pBtns.appendChild(el('span', { class: 'page-total', text: '…' }));
    } else {
      pBtns.appendChild(el('button', {
        class: 'page-btn' + (n === page ? ' active' : ''),
        type: 'button',
        onclick: function () { onChange(n, null); },
      }, String(n)));
    }
  });
  pBtns.appendChild(el('button', {
    class: 'page-btn',
    type: 'button',
    disabled: page >= totalPages ? 'disabled' : null,
    onclick: function () { if (page < totalPages) onChange(page + 1, null); },
  }, '下一页 ›'));
  wrap.appendChild(pBtns);

  // Right: total count
  wrap.appendChild(el('div', { class: 'page-total', text: '共 ' + total.toLocaleString('en-US') + ' 条' }));

  return wrap;
}

function computePageNumbers(current, totalPages, windowSize) {
  if (totalPages <= windowSize + 2) {
    const arr = [];
    for (let i = 1; i <= totalPages; i++) arr.push(i);
    return arr;
  }
  const half = Math.floor(windowSize / 2);
  let start = Math.max(2, current - half);
  let end = Math.min(totalPages - 1, current + half);
  if (current - half < 2) end = Math.min(totalPages - 1, end + (2 - (current - half)));
  if (current + half > totalPages - 1) start = Math.max(2, start - ((current + half) - (totalPages - 1)));
  const arr = [1];
  if (start > 2) arr.push('...');
  for (let i = start; i <= end; i++) arr.push(i);
  if (end < totalPages - 1) arr.push('...');
  arr.push(totalPages);
  return arr;
}

document.addEventListener('DOMContentLoaded', function () {
  renderApp();
});
